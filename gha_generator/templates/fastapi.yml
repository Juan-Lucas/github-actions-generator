name: {{ project_name }} - FastAPI CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  PYTHON_VERSION: "{{ python_version }}"
  PROJECT_NAME: {{ project_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python {{ python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: "{{ python_version }}"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn pytest pytest-cov httpx

      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github
        continue-on-error: true

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Build Docker image
        run: |
          docker build -t ${{ github.repository }}:latest .
        continue-on-error: true

      - name: Push Docker image (optional)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Pousser l'image Docker sur Docker Hub ou GHCR ici"
        continue-on-error: true

      - name: Deploy to cloud (optional)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Déployer sur votre cloud ici (ex: Azure, AWS, GCP)"
        continue-on-error: true
